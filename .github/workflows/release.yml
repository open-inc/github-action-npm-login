name: Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The tag has to carry a dist/ that matches src/, because consumers run
      # the bundle straight from the tag.
      - name: Build
        run: npm run build

      - name: Semantic Release 🚀
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          branches: master
          extra_plugins: |
            @semantic-release/changelog@^6
            @semantic-release/commit-analyzer@^13
            @semantic-release/git@^10
            @semantic-release/github@^12
            @semantic-release/npm@^13
            @semantic-release/release-notes-generator@^14
            semantic-release-export-data@^1
        env:
          GH_TOKEN: ${{ secrets.OPENINC_SEMANTIC_RELEASE }}

      # semantic-release only creates the immutable vX.Y.Z tag. Consumers pin
      # the major (`@v2`), so that tag has to be force-moved onto the release.
      - name: Move major version tag
        if: steps.semantic.outputs.new-release-published == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENINC_SEMANTIC_RELEASE }}
          VERSION: ${{ steps.semantic.outputs.new-release-version }}
        run: |
          set -euo pipefail

          MAJOR="v${VERSION%%.*}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # semantic-release pushed "v$VERSION" to the remote; fetch it back so
          # we tag the exact commit that was released.
          git fetch --force "$REMOTE" "refs/tags/v${VERSION}:refs/tags/v${VERSION}"

          git tag --force --annotate "$MAJOR" \
            --message "Latest ${MAJOR}.x release (currently v${VERSION})" \
            "v${VERSION}^{commit}"

          git push --force "$REMOTE" "refs/tags/${MAJOR}"

          echo "Moved $MAJOR to v$VERSION" >> "$GITHUB_STEP_SUMMARY"

    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
      new-release-git-tag: ${{ steps.semantic.outputs.new-release-git-tag }}
